/* BIWEB Studio — componentes. Todos os valores vêm de tokens.css. */
body { margin: 0; background: var(--surface-panel); color: var(--text-primary); font: 400 12px/16px var(--font-sans); -webkit-font-smoothing: antialiased; }
.bw-pad { padding: var(--space-3); }
.bw-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.bw-col { display: flex; flex-direction: column; gap: var(--space-2); }
.bw-num { font-variant-numeric: tabular-nums; }
.bw-mono { font-family: var(--font-mono); }
.bw-muted { color: var(--text-muted); }
.bw-secondary { color: var(--text-secondary); }
.bw-cap { font-size: 11px; line-height: 16px; font-weight: 500; }
.bw-label { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .02em; color: var(--text-secondary); }
.bw-ico { width: var(--icon-md); height: var(--icon-md); flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; }
.bw-ico-sm { width: var(--icon-sm); height: var(--icon-sm); flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; }
:where(.bw-btn, .bw-iconbtn, .bw-seg button, .bw-input, .bw-select, .bw-tab, .bw-tree-item, .bw-menu-item, .bw-switch, .bw-check input, .bw-chip, .bw-pagetab, .bw-pane-btn, .bw-viz-item):focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }

/* Button */
.bw-btn { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--control-md); padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--border-control); background: var(--surface-panel); color: var(--text-primary); font: 600 12px/16px var(--font-sans); cursor: pointer; transition: background 80ms; }
.bw-btn:hover { background: var(--surface-hover); }
.bw-btn:active { background: var(--surface-pressed); }
.bw-btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.bw-btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.bw-btn--ghost { border-color: transparent; background: transparent; }
.bw-btn--danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.bw-btn--lg { height: var(--control-lg); }
.bw-btn--sm { height: var(--control-sm); padding: 0 var(--space-2); }
.bw-btn[disabled], .bw-btn[aria-disabled="true"] { background: var(--surface-app); border-color: var(--border-subtle); color: var(--text-disabled); cursor: not-allowed; }

/* IconButton */
.bw-iconbtn { display: inline-grid; place-items: center; width: var(--control-md); height: var(--control-md); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-secondary); cursor: pointer; }
.bw-iconbtn:hover { background: var(--surface-hover); color: var(--text-primary); }
.bw-iconbtn[aria-pressed="true"] { background: var(--accent-subtle); color: var(--accent); }
.bw-iconbtn--sm { width: var(--control-sm); height: var(--control-sm); }
.bw-iconbtn[disabled] { color: var(--text-disabled); cursor: not-allowed; background: transparent; }

/* SegmentedControl */
.bw-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius-sm); background: var(--surface-pressed); }
.bw-seg button { height: var(--control-sm); padding: 0 var(--space-2); border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--text-secondary); font: 500 12px/16px var(--font-sans); cursor: pointer; }
.bw-seg button[aria-pressed="true"] { background: var(--surface-panel); color: var(--text-primary); font-weight: 600; box-shadow: 0 0 0 1px var(--border-default); }

/* Input / Select */
.bw-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.bw-input, .bw-select { display: flex; align-items: center; gap: var(--space-1); height: var(--control-md); padding: 0 var(--space-2); border: 1px solid var(--border-control); border-radius: var(--radius-sm); background: var(--surface-panel); color: var(--text-primary); font: 400 12px/16px var(--font-sans); min-width: 0; box-sizing: border-box; }
.bw-input input { all: unset; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
.bw-input .bw-prefix, .bw-input .bw-unit { color: var(--text-muted); font-size: 11px; }
.bw-input--quiet { border-color: transparent; background: var(--surface-app); }
.bw-input--quiet:hover { border-color: var(--border-default); }
.bw-input:focus-within { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.bw-input[data-invalid] { border-color: var(--danger); }
.bw-input[data-mixed] input { color: var(--text-muted); font-style: italic; }
.bw-input[data-disabled] { background: var(--surface-app); border-color: var(--border-subtle); color: var(--text-disabled); }
.bw-help { font-size: 11px; color: var(--text-muted); }
.bw-help--error { color: var(--danger); }
.bw-select { justify-content: space-between; cursor: pointer; white-space: nowrap; overflow: hidden; }
.bw-swatch { width: 14px; height: 14px; border-radius: var(--radius-xs); box-shadow: inset 0 0 0 1px var(--border-default); flex: none; }

/* Checkbox / Switch */
.bw-check { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--control-sm); cursor: pointer; }
.bw-check input { appearance: none; margin: 0; width: 14px; height: 14px; border: 1px solid var(--border-control); border-radius: var(--radius-xs); background: var(--surface-panel); display: grid; place-items: center; }
.bw-check input:checked, .bw-check input:indeterminate { background: var(--accent); border-color: var(--accent); }
.bw-check input:checked::after { content: ""; width: 8px; height: 4px; border: solid var(--on-accent); border-width: 0 0 1.5px 1.5px; transform: translateY(-1px) rotate(-45deg); }
.bw-check input:indeterminate::after { content: ""; width: 8px; height: 1.5px; background: var(--on-accent); }
.bw-check input:disabled { border-color: var(--border-subtle); background: var(--surface-app); }
.bw-switch { position: relative; width: 28px; height: 16px; border-radius: 8px; border: 1px solid var(--border-control); background: var(--surface-panel); padding: 0; cursor: pointer; flex: none; }
.bw-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 5px; background: var(--border-control); transition: transform 80ms; }
.bw-switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.bw-switch[aria-checked="true"]::after { transform: translateX(12px); background: var(--on-accent); }
.bw-switch[disabled] { border-color: var(--border-subtle); background: var(--surface-app); }
.bw-switch[disabled]::after { background: var(--text-disabled); }

/* Tabs */
.bw-tabs { display: flex; gap: var(--space-3); border-bottom: 1px solid var(--border-subtle); padding: 0 var(--space-3); }
.bw-tab { height: var(--control-md); padding: 0; border: 0; background: none; color: var(--text-secondary); font: 500 12px/16px var(--font-sans); box-shadow: inset 0 -2px 0 transparent; cursor: pointer; }
.bw-tab[aria-selected="true"] { color: var(--text-primary); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.bw-tab .bw-count { margin-left: var(--space-1); color: var(--text-muted); font-weight: 500; }

/* Menu / Tooltip / Popover */
.bw-menu { width: 220px; padding: var(--space-1) 0; border-radius: var(--radius-md); background: var(--surface-elevated); box-shadow: var(--shadow-popover); }
.bw-menu-item { display: flex; align-items: center; gap: var(--space-2); height: var(--control-md); padding: 0 var(--space-3); color: var(--text-primary); cursor: default; }
.bw-menu-item:hover, .bw-menu-item[data-focus] { background: var(--surface-hover); }
.bw-menu-item .bw-kbd { margin-left: auto; color: var(--text-muted); font-size: 11px; }
.bw-menu-item[aria-disabled="true"] { color: var(--text-disabled); }
.bw-menu-item--danger { color: var(--danger); }
.bw-menu-sep { height: 1px; margin: var(--space-1) 0; background: var(--border-subtle); }
.bw-menu-label { padding: var(--space-1) var(--space-3); font: 600 11px/16px var(--font-sans); color: var(--text-muted); }
.bw-tooltip { display: inline-block; max-width: 240px; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); background: var(--viz-tooltip-bg); color: var(--viz-tooltip-text); font: 500 11px/16px var(--font-sans); }
.bw-popover { padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-elevated); box-shadow: var(--shadow-popover); }

/* Badge */
.bw-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 18px; padding: 0 6px; border-radius: var(--radius-xs); font: 600 11px/16px var(--font-sans); background: var(--surface-pressed); color: var(--text-secondary); white-space: nowrap; }
.bw-badge--success { background: var(--success-subtle); color: var(--success); }
.bw-badge--warning { background: var(--warning-subtle); color: var(--warning); }
.bw-badge--danger { background: var(--danger-subtle); color: var(--danger); }
.bw-badge--accent { background: var(--accent-subtle); color: var(--accent); }
.bw-counter { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--surface-pressed); color: var(--text-secondary); font: 600 11px/16px var(--font-sans); text-align: center; }

/* Panel / Inspector */
.bw-panel { width: var(--panel-width); background: var(--surface-panel); border-left: 1px solid var(--border-subtle); box-sizing: border-box; }
.bw-panel-head { display: flex; align-items: center; gap: var(--space-2); height: 36px; padding: 0 var(--space-2) 0 var(--space-3); border-bottom: 1px solid var(--border-subtle); }
.bw-panel-title { font: 600 13px/20px var(--font-sans); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bw-panel-sub { color: var(--text-muted); font-weight: 400; }
.bw-search { margin: var(--space-2) var(--space-3); }
.bw-section { border-top: 1px solid var(--border-subtle); padding: var(--space-1) 0 var(--space-2); }
.bw-section-head { display: flex; align-items: center; gap: var(--space-1); height: var(--control-md); padding: 0 var(--space-2) 0 var(--space-1); }
.bw-section-head .bw-label { flex: 1; color: var(--text-primary); }
.bw-section-head .bw-summary { color: var(--text-muted); font-size: 11px; margin-right: var(--space-1); }
.bw-section[data-collapsed] { padding-bottom: 0; }
.bw-section-actions { display: flex; opacity: 0; }
.bw-section-head:hover .bw-section-actions, .bw-section-head:focus-within .bw-section-actions { opacity: 1; }
.bw-prop { display: grid; grid-template-columns: 76px minmax(0,1fr); align-items: center; gap: var(--space-2); min-height: var(--control-md); padding: 0 var(--space-3); }
.bw-prop > .bw-label { font-weight: 500; }
.bw-prop-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.bw-prop[data-disabled] > .bw-label { color: var(--text-disabled); }

/* TreeView */
.bw-tree { list-style: none; margin: 0; padding: var(--space-1) 0; }
.bw-tree-item { display: flex; align-items: center; gap: var(--space-1); height: var(--control-md); padding: 0 var(--space-2) 0 calc(var(--space-2) + var(--lvl, 0) * var(--space-4)); color: var(--text-primary); cursor: default; }
.bw-tree-item:hover { background: var(--surface-hover); }
.bw-tree-item[aria-selected="true"] { background: var(--accent-subtle); }
.bw-tree-item .bw-chev { color: var(--text-muted); width: 12px; }
.bw-tree-item .bw-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bw-tree-item .bw-hover-actions { display: none; }
.bw-tree-item:hover .bw-hover-actions, .bw-tree-item:focus-within .bw-hover-actions { display: flex; }
.bw-tree-item[data-hidden] .bw-name { color: var(--text-muted); }
.bw-tree-group { height: 24px; display: flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-3); color: var(--text-muted); font: 600 11px/16px var(--font-sans); }

/* Field type glyph */
.bw-ft { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: var(--radius-xs); font: 600 10px/1 var(--font-mono); flex: none; }
.bw-ft--dimension { color: var(--field-dimension); }
.bw-ft--measure { color: var(--field-measure); }
.bw-ft--metric { color: var(--field-metric); }
.bw-ft--geo { color: var(--field-geo); }
.bw-ft--calc { color: var(--field-calc); }
.bw-used { width: 6px; height: 6px; border-radius: 3px; background: var(--accent); flex: none; }
.bw-deprecated .bw-name { text-decoration: line-through; color: var(--text-muted); }

/* FieldWell / FieldChip */
.bw-well { padding: var(--space-1) var(--space-3) var(--space-2); }
.bw-well-head { display: flex; align-items: center; justify-content: space-between; height: 24px; }
.bw-slot { display: flex; flex-direction: column; gap: var(--space-1); min-height: var(--control-md); }
.bw-slot-empty { display: flex; align-items: center; height: var(--control-md); padding: 0 var(--space-2); border: 1px dashed var(--border-control); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 11px; }
.bw-slot-empty[data-drop] { border-color: var(--drop-target); background: var(--drop-target-bg); color: var(--accent); }
.bw-slot-empty[data-invalid] { border-color: var(--danger); background: var(--danger-subtle); color: var(--danger); }
.bw-chip { display: flex; align-items: center; gap: var(--space-1); height: var(--control-md); padding: 0 var(--space-1) 0 var(--space-2); border-radius: var(--radius-sm); background: var(--surface-app); border: 1px solid var(--border-subtle); color: var(--text-primary); }
.bw-chip .bw-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bw-chip .bw-mod { color: var(--text-muted); font-size: 11px; }
.bw-chip[data-dragging] { box-shadow: var(--shadow-toolbar); background: var(--surface-elevated); }

/* FilterChip / GlobalContextBar */

/* ---- protótipo: layout do shell ---- */

let openPop = null;

  const el = popAt(anchor, html, { alignRight: true });

  el.addEventListener('keydown', e => {

    `<div class="bw-w-head"><div class="bw-w-title"><b>${esc(w.title)}</b><span>${esc(w.sub || '')}${w.mod === 'ytd' ? ' · acumulado no ano' : w.mod === 'pct' ? ' · % do total' : ''}</span>${drill}</div>
     <div class="bw-w-actions">${mode === 'viewer' ? `<button class="bw-iconbtn" data-wact="fs" data-id="${w.id}" aria-label="Tela cheia" title="Tela cheia">${ic('expand')}</button>` : ''}<button class="bw-iconbtn" data-wact="menu" data-id="${w.id}" data-pop aria-label="Mais opções de ${esc(w.title)}" title="Mais opções">${ic('more')}</button></div></div>`;

function boardHTML(list, boardW, mode) {
  if (mode === 'viewer' && boardW < 700) { let y = 0; list = [...list].sort((p, q) => p.y - q.y || p.x - q.x).map(w => { const n = { ...w, x: 0, w: 12, y, h: w.type === 'kpi' ? 2 : 5 }; y += n.h; return n; }); } // xs: empilha em ordem de leitura

let drag = null;

  if (!wEl) { if (S.sel.length) { S.sel = []; afterSel(); } return; }
  const id = wEl.dataset.id;
  if (e.shiftKey || e.metaKey || e.ctrlKey) { S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : [...S.sel, id]; afterSel(); return; }

function startDrag(e, w, mode) {

}

  if (mode === 'move') { n.x = Math.min(12 - n.w, Math.max(0, orig.x + cx)); n.y = Math.max(0, orig.y + cy); }
  else {
    if (mode.includes('e')) n.w = Math.max(2, Math.min(12 - orig.x, orig.w + cx));
    if (mode.includes('s')) n.h = Math.max(2, orig.h + cy);
    if (mode.includes('w')) { const nx = Math.max(0, Math.min(orig.x + orig.w - 2, orig.x + cx)); n.w = orig.w + orig.x - nx; n.x = nx; }
    if (mode.includes('n')) { const ny = Math.max(0, Math.min(orig.y + orig.h - 2, orig.y + cy)); n.h = orig.h + orig.y - ny; n.y = ny; }
  }
  drag.next = n;

  others.forEach(o => { edgesX.add(o.x); edgesX.add(o.x + o.w); edgesY.add(o.y); edgesY.add(o.y + o.h); });

  [n.y, n.y + n.h].forEach(y => { if (edgesY.has(y)) ov += `<div class="guide-h" style="top:${y === 0 ? PAD : g.py(y) - G / 2}px"></div>`; });

}

  }

  parts.push(['cond', 'Formatação condicional', `<div class="bw-help" style="padding:0 12px 6px">Sem regras.</div>`, `<button class="bw-iconbtn bw-iconbtn--sm" aria-label="Adicionar regra" title="Adicionar regra">${ic('plus', 'bw-ico-sm')}</button>`]);
  const shown = parts.filter(p => !q || p[1].toLowerCase().includes(q) || p[2].toLowerCase().includes(q));
  h += shown.map(p => sec(p[0], p[1], p[2], p[3] || '')).join('') || `<div class="insp-empty">Nenhuma propriedade com "${esc(S.search)}".</div>`;
  return h;
}

function duplicate(w) {

function removeSel(ids) {

function addField(k, role) {
  const w = S.sel.length === 1 ? byId(S.sel[0]) : null;
  const f = FIELDS[k];
  if (!w) {
    // soltar no canvas: novo visual
    const isMetric = f.kind === 'metric';
    const n = W({ type: isMetric ? 'kpi' : (f.kind === 'geo' ? 'map' : 'hbar'), metric: isMetric ? (DATA.kpi[k] ? k : 'receita') : 'receita', dim: isMetric ? null : k, title: isMetric ? f.name : 'Receita', sub: isMetric ? 'jan–set/2026' : 'por ' + f.name.toLowerCase(), x: 0, y: firstFreeRow(cur()), w: isMetric ? 3 : 6, h: isMetric ? 2 : 5 });
    if (!isMetric && !DIM_DATA[k]) { n.type = 'empty'; n.note = `"${f.name}" não tem série nos dados de exemplo do protótipo.`; }
    snapshot(`Adicionar visual ${n.title} ${n.sub}`); cur().push(n); S.sel = [n.id]; render(); return;
  }

  if (role === 'dim' && isMetric) { toast(`"${f.name}" é uma métrica: arraste para Valores.`, { tone: 'danger' }); return; }
  if (f.pii) { toast('Sem permissão: E-mail do cliente é PII e está mascarado para o seu papel.', { tone: 'danger' }); return; }
  if (f.dep) { toast(`"${f.name}" está depreciado. Use ${f.dep}.`, { tone: 'danger' }); return; }
  snapshot(`Definir ${role === 'val' ? 'valor' : 'eixo'} de ${w.title}: ${f.name}`);
  if (role === 'val') { w.metric = DATA.kpi[k] ? k : k; w.title = f.name; if (!DATA.kpi[k] && w.type === 'kpi') { w.type = 'empty'; w.note = `"${f.name}" está em rascunho e não tem valor nos dados de exemplo.`; } }
  else {
    w.dim = k; w.drill = null; w.sub = 'por ' + f.name.toLowerCase().replace('data (mês)', 'mês');
    if (!DIM_DATA[k]) { w.prevType = w.type; w.type = 'empty'; w.note = `"${f.name}" não tem série nos dados de exemplo do protótipo.`; }
    else if (w.type === 'empty') w.type = w.prevType || 'hbar';
    if (w.type === 'map' && k !== 'estado') w.type = 'hbar';
    if ((w.type === 'line' || w.type === 'area') && k !== 'mes') w.type = 'bar';
  }
  render();
}

  const rs = t.closest('[data-reset]'); if (rs) { toast('Tamanho e posição: sem padrão diferente do atual'); return; }
  const al = t.closest('[data-align]'); if (al) { alignSel(al.dataset.align); return; }
  const mt = t.closest('[data-mt]');
  if (mt) { const w = byId(S.sel[0]); const k = mt.dataset.mt; if (k === 'dados' || k === 'formato') { S.inspTab = k; S.insp = true; render(); } else if (k === 'viz') vizPicker(mt, w); else widgetMenu(mt, w.id, 'builder'); return; }
  const rc = t.closest('[data-rmchip]'); if (rc) { const w = byId(S.sel[0]); snapshot(`Remover campo de ${w.title}`); if (rc.dataset.rmchip === 'dim') { w.prevType = w.type; w.dim = null; w.type = 'empty'; w.note = 'Arraste uma dimensão para o eixo.'; } else { w.prevType = w.type; w.type = 'empty'; w.note = 'Arraste uma métrica para Valores.'; w.metric = null; } render(); return; }
  const cm = t.closest('[data-chipmenu]');

    const w = byId(S.sel[0]);

      { label: 'Acumulado no ano (YTD)', disabled: w.dim !== 'mes' ? 'YTD requer data no eixo' : null, act: () => setMod(w, 'ytd') },
      { label: '% do total', act: () => setMod(w, 'pct') },
      { label: 'vs ano anterior', disabled: 'Receita vs ano anterior está em rascunho (não certificada)', act: () => { } },
      '-', { label: 'Formato: R$ mi', act: () => { } }, { label: 'Renomear neste visual', act: () => { S.inspTab = 'formato'; render(); setTimeout(() => { const i = $('[data-txt=title]'); i && i.focus(); }); } },
    ], 'Modificadores · sem agregação livre');
    else menu(cm, [{ label: 'Hierarquia: subir/descer nível', disabled: 'Use o drill no modo leitura', act: () => { } }, { label: 'Ordenar por Receita', act: () => toast('Ordenado por Receita, decrescente') }, { label: 'Mostrar itens sem dados', act: () => { } }], 'Dimensão');
    return;
  }
  const sw = t.closest('[data-swatch]'); if (sw) { popAt(sw, `<div class="bw-popover"><div class="bw-label" style="margin-bottom:6px">Paleta do tema · categórica</div><div class="bw-swatches">${[1, 2, 3, 4, 5, 6, 7, 8].map(i => `<button class="bw-swatch-btn" style="background:var(--viz-cat-${i})" aria-label="Série ${i}"${i === 1 ? ' aria-pressed="true"' : ''}></button>`).join('')}</div><div class="bw-help" style="margin-top:6px">Cores do tema acompanham a troca de tema do dashboard.</div></div>`); return; }
  const pr = t.closest('[data-prompt]'); if (pr) { aiAsk(pr.dataset.prompt); return; }
  const sg = t.closest('[data-sug]'); if (sg) { const k = sg.dataset.sug; if (k === 'varcat') proposeVarCat(); if (k === 'filtrocat') proposeFilterCat(); if (k === 'ruptura') { S.modelProposal = true; S.impact = false; go('model'); toast('Proposta da IA adicionada ao rascunho do modelo; publicar exige revisão humana'); return; } attachProposal(sg.textContent.trim()); return; }
  // modelo
  const en = t.closest('[data-ent]');
  if (en && S.view === 'model') { S.modelSel = { kind: 'entity', id: en.dataset.ent }; S.impact = false; renderModel(); return; }
  if (en && S.view === 'builder') { const n = en.dataset.ent; openEnt.has(n) ? openEnt.delete(n) : openEnt.add(n); $('.leftpane').innerHTML = datasetHTML(); return; }
  const rl = t.closest('[data-rel],[data-relsel]'); if (rl) { S.modelSel = { kind: 'rel', id: rl.dataset.rel || rl.dataset.relsel }; S.impact = false; renderModel(); return; }
  const ro = t.closest('[data-relon]'); if (ro) { const r = RELS.find(x => x.id === ro.dataset.relon); r.on = !r.on; renderModel(); toast(`Relação ${r.from} → ${r.to} ${r.on ? 'ativada' : 'desativada'} no rascunho`); return; }
});
function attachProposal(label) {
  const turn = { q: label, ctx: aiContext(), body: '<p>Proposta pronta; veja a pré-visualização no canvas.</p>' };

  turn.html = () => `<div class="ai-turn"><div class="bw-cap bw-muted">${esc(turn.ctx)}</div><div class="ai-q">${esc(turn.q)}</div><div class="ai-ans">${turn.body}${S.proposal && turn.pid === S.proposal.id ? proposalHTML() : '<p class="bw-cap bw-muted">Proposta encerrada.</p>'}</div></div>`;
  S.aiTurns.push(turn); S.aiOpen = true; render(); const b = $('#aibody'); if (b) b.scrollTop = b.scrollHeight;
}
function roomForAI() { if (S.aiOpen && S.view === 'builder' && S.left && S.insp && innerWidth < 1700) { S.left = null; toast('Painel Dados recolhido para manter o canvas legível. Reabra pelo seletor de painéis.'); } }
function setMod(w, m) { snapshot(`Modificador de ${w.title}: ${m || 'nenhum'}`); w.mod = m; render(); }
function addFilter(k, label, val) { if (S.filters.some(f => f.k === k)) return; S.filters.push({ k, label, val }); render(); }
function alignSel(kind) {
  const ws = S.sel.map(byId); const ref = ws[0];
  const next = ws.map(w => ({ ...w, ...(kind === 'left' ? { x: Math.min(...ws.map(v => v.x)) } : kind === 'top' ? { y: Math.min(...ws.map(v => v.y)) } : kind === 'w' ? { w: ref.w } : { h: ref.h }) }));
  const others = cur().filter(o => !S.sel.includes(o.id));
  if (next.some((n, i) => others.some(o => overlaps(n, o)) || next.some((m, j) => j !== i && overlaps(n, m)))) { toast('Alinhamento bloqueado: os visuais se sobreporiam na grade.', { tone: 'danger' }); return; }

}
document.addEventListener('pointerdown', e => { if (S.view === 'builder') onBoardDown(e); });
document.addEventListener('pointermove', onMove);
document.addEventListener('pointerup', onUp);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.num && S.sel.length) {

    const others = cur().filter(o => !S.sel.includes(o.id));

    snapshot(`Alterar ${k.toUpperCase()} de ${S.sel.length > 1 ? S.sel.length + ' visuais' : byId(S.sel[0]).title}`); next.forEach(n => Object.assign(byId(n.id), n)); render(); return;
  }
  if (t.dataset.txt) { const w = byId(S.sel[0]); snapshot(`Renomear ${w.title}`); w[t.dataset.txt] = t.value; drawBoard(); afterSel(); return; }
  if (t.dataset.fmt) { const w = byId(S.sel[0]); snapshot(`Destaque em ${w.title}`); w.fmt[t.dataset.fmt] = t.checked; drawBoard(); return; }
  if (t.dataset.pitem != null && S.proposal) { S.proposal.items[+t.dataset.pitem].on = t.checked; render(); return; }
  if (t.id === 'pgname') { snapshot('Renomear página'); S.pageNames[S.page] = t.value || S.pageNames[S.page]; render(); }
});
document.addEventListener('input', e => {

  if (e.target.id === 'propq') { S.search = e.target.value; const pos = e.target.selectionStart; $('#insp').innerHTML = inspectorHTML(); const i = $('#propq'); i.focus(); i.setSelectionRange(pos, pos); }
});
/* arrastar campos do painel Dados */
document.addEventListener('dragstart', e => { const f = e.target.closest && e.target.closest('[data-field]'); if (f) { e.dataTransfer.setData('text/plain', f.dataset.field); S.dragField = f.dataset.field; } });
document.addEventListener('dragend', () => { S.dragField = null; $$('.bw-slot-empty[data-drop],.bw-slot-empty[data-invalid]').forEach(x => { x.removeAttribute('data-drop'); x.removeAttribute('data-invalid'); }); });
document.addEventListener('dragover', e => {
  const slot = e.target.closest && e.target.closest('[data-slot]'); const board = e.target.closest && e.target.closest('#board');

    const em = slot.querySelector('.bw-slot-empty'); if (em) { em.toggleAttribute('data-drop', ok); em.toggleAttribute('data-invalid', !ok); em.textContent = ok ? `Solte para usar ${f.name}` : f.pii ? `${f.name}: sem permissão` : `${f.name} não é aceito aqui`; }
  } else if (board) e.preventDefault();
});
document.addEventListener('drop', e => {
  const k = e.dataTransfer.getData('text/plain'); if (!FIELDS[k]) return;

});
document.addEventListener('dblclick', e => { const f = e.target.closest('[data-field]'); if (f && S.view === 'builder') addField(f.dataset.field); });

/* teclado */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdk(); return; }
  if (e.target.id === 'aiq' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); aiAsk(e.target.value); return; }
  if (e.key === 'Escape') { if (openPop) { closePop(); return; } if (S.fsWidget) { S.fsWidget = null; render(); return; } if (S.present) { S.present = false; render(); return; } if (S.view === 'builder' && S.sel.length) { S.sel = []; afterSel(); } return; }
  if (typing) return;
  if (S.present && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const i = S.pageOrder.indexOf(S.viewerPage); S.viewerPage = S.pageOrder[(i + (e.key === 'ArrowRight' ? 1 : -1) + S.pageOrder.length) % S.pageOrder.length]; render(); return; }
  if (S.view !== 'builder') return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd' && S.sel.length === 1) { e.preventDefault(); duplicate(byId(S.sel[0])); return; }
  const step = e.shiftKey ? 10 : 1;
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv && S.sel.length && !e.target.closest('.leftpane,.rightpane,.bw-menu')) { e.preventDefault(); nudge(...mv); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel.length) { e.preventDefault(); removeSel([...S.sel]); return; }
  if (e.key === 'Enter' && e.target.closest('[data-sel]')) { e.target.click(); return; }
  if (e.key === 'Enter' && e.target.closest('[data-field]')) { addField(e.target.closest('[data-field]').dataset.field); return; }
  if (e.key === 'Tab' && e.target.id === 'board' && cur().length) { e.preventDefault(); const L = [...cur()].sort((a, b) => a.y - b.y || a.x - b.x); const i = L.findIndex(w => w.id === S.sel[0]); S.sel = [L[(i + (e.shiftKey ? -1 : 1) + L.length) % L.length].id]; afterSel(); return; }
  if (e.key.toLowerCase() === 'i' && !e.metaKey && !e.ctrlKey) { addField('receita'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.tbl tr.click, .bw-empty-action, [data-ent], [data-relsel]')) { e.target.click(); } });
(() => { const h = document.documentElement.getAttribute('data-theme'); S.appTheme = h === 'dark' || h === 'light' ? h : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); S.dashTheme = 'light'; })();
addEventListener('resize', () => { if (S.view === 'builder') drawBoard(); if (S.view === 'viewer') renderViewer(); });
render();
