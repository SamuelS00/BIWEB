server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # O host localhost pode compartilhar cookies de outras aplicações locais.
  large_client_header_buffers 4 32k;

  gzip on;
  gzip_types application/javascript application/json image/svg+xml text/css;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  # Diretiva do Cloudflare Pages; não é um recurso público no container nginx.
  location = /_headers {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|svg|woff2?|png|jpe?g|gif|webp|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
