services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: biweb-web:local
    ports:
      - "${BIWEB_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
